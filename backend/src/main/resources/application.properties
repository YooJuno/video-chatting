spring.application.name=pair
logging.level.org.springframework.boot=INFO
logging.level.org.springframework.web=INFO
spring.config.import=optional:file:.env[.properties]
server.address=${HOST:127.0.0.1}
server.port=${PORT:3300}
server.error.include-message=never
server.error.include-stacktrace=never
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=5s
chat.allowed-origins=${PUBLIC_ORIGIN:http://localhost:3300,http://127.0.0.1:3300,http://localhost:3305,http://127.0.0.1:3305}
chat.max-clients=${MAX_CLIENTS:200}
chat.stun-url=${STUN_URL:stun:stun.l.google.com:19302}
chat.turn-url=${TURN_URL:}
chat.turn-shared-secret=${TURN_SHARED_SECRET:}
chat.relay-only=${RELAY_ONLY:false}
